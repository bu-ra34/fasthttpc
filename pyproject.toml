[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasthttpc"
version = "0.3.0"
description = "Pure-Python HTTP istemcisi — TLS 1.3 fingerprinting, async destek, connection pool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Buğra" }]
dependencies = [
    "cryptography>=41.0",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
brotli = ["brotli>=1.0"]
zstd   = ["zstandard>=0.21"]
dev    = ["pytest>=7.0"]
all    = ["brotli>=1.0", "zstandard>=0.21", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/kullanici/fasthttpc"

[tool.setuptools.packages.find]
where = ["."]
include = ["fasthttpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Mevcut kod tabanında varsayılan kural seti (E4/E7/E9/F) ~35 uyarı veriyor
# (çoğu kullanılmayan import). Şimdilik yalnızca kritik kurallar açık:
# sözdizimi hataları, geçersiz karşılaştırmalar, yanlış yerde return/yield,
# tanımsız isimler. Temizlik sonrası genişletilebilir.
select = ["E9", "F63", "F7", "F82"]
