[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fasthttpc"
version = "0.2.4"
description = "Pure-Python HTTP istemcisi — TLS 1.3 fingerprinting, async destek, connection pool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Buğra" }]
dependencies = [
    "cryptography>=41.0",
    "certifi>=2023.7.22",
]

[project.optional-dependencies]
brotli = ["brotli>=1.0"]
zstd   = ["zstandard>=0.21"]
dev    = ["pytest>=7.0"]
all    = ["brotli>=1.0", "zstandard>=0.21", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/kullanici/fasthttpc"

[tool.setuptools.packages.find]
where = ["."]
include = ["fasthttpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
