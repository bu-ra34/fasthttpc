site_name: fasthttpc
site_description: Pure-Python HTTP client with browser TLS/HTTP2 fingerprint impersonation
site_url: https://bu-ra34.github.io/fasthttpc/
repo_url: https://github.com/bu-ra34/fasthttpc
repo_name: bu-ra34/fasthttpc
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: null

nav:
  - Home: index.md
  - Getting started:
      - Quick start: quickstart.md
      - Sync and async usage: usage.md
      - Migrating from requests: migration-requests.md
      - Migrating from httpx: migration-httpx.md
  - Guides:
      - Profiles and fingerprints: profiles.md
      - Proxies: proxy.md
      - TLS: tls.md
      - HTTP/2: http2.md
      - Timeouts, limits, retries: timeouts-limits-retries.md
      - Testing with MockTransport: testing.md
  - Features:
      - Streaming responses: features/streaming.md
      - Auth and hooks: features/auth-hooks.md
      - Client certificates (mTLS): features/client-certs.md
      - Legacy TLS: features/legacy-tls.md
      - HTTP/3 (experimental): features/http3.md
      - Trio support: features/trio.md
  - Reference:
      - API reference: reference/api.md
      - Security model: security.md
      - Security review (2026-11): security-audit.md
      - Known limits: limits.md
      - Performance: performance.md
